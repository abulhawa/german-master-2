name: Web accessibility acceptance

on:
  pull_request:
    paths: &accessibility-paths
      - '.github/workflows/web-accessibility.yml'
      - 'apps/web/client/src/foundation/**'
      - 'apps/web/client/src/renovation/**'
      - 'apps/web/learner-preview/**'
      - 'apps/web/scripts/verify-v2-accessibility.mjs'
      - 'apps/web/vite.learner-preview.config.ts'
      - 'apps/web/package.json'
      - 'apps/web/tsconfig.json'
      - 'design/**'
      - 'contracts/**'
      - 'services/api/**'
      - 'packages/**'
      - 'content/**'
      - 'db/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '!**/*.md'
      - '!**/*.mdx'
  push:
    branches: [main]
    paths: *accessibility-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-accessibility-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_USE_GROQ: '0'
      TEST_DATABASE_URL: ''
      GROQ_API_KEY: ''
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build isolated v2 learner fixture
        run: npm run build:learner-preview
      - name: Install isolated Chromium
        run: npx playwright install --with-deps chromium
      - name: Keyboard reflow and semantic acceptance
        run: node apps/web/scripts/verify-v2-accessibility.mjs

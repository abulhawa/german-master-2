name: Refresh security lockfile once

on:
  push:
    branches: [security/dependabot-remediation-2026-10-27]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate workspace lockfile and apply nonbreaking audit fixes
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm audit fix --ignore-scripts --no-fund
          npm audit --audit-level=low
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'security: update transitive dependency versions to resolve audit advisories'
            git push origin HEAD:security/dependabot-remediation-2026-10-27
          fi

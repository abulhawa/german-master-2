name: Prepare low-typing release artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'content/candidates/low-typing-conversion/draft.json'
      - 'services/api/scripts/prepare-low-typing-release.ts'
      - 'services/api/src/low-typing*.test.ts'
      - '.github/workflows/prepare-low-typing-release.yml'

permissions:
  contents: write

jobs:
  generate:
    if: >
      github.event.pull_request.head.repo.full_name == 'abulhawa/german-master-2' &&
      github.head_ref == 'content/low-typing-legacy-conversion'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout author branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate candidate and verify immutable release
        run: |
          npx tsx services/api/scripts/prepare-low-typing-release.ts
          npx vitest run --config vitest.backend.config.ts services/api/src/low-typing-conversion.test.ts services/api/src/low-typing-release.test.ts
      - name: Commit generated files to the author branch only
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git add content/candidates/low-typing-conversion/seed.sql \
            content/candidates/low-typing-conversion/catalog.json \
            content/candidates/low-typing-conversion/offline.json \
            content/candidates/low-typing-conversion/manifest.json \
            content/production/catalog.json content/guest/practice.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "content: generate verified immutable selection release"
            git push origin "HEAD:$BRANCH"
          fi

name: Web checks

on:
  pull_request:
    paths: &web-paths
      - 'api/**'
      - 'vercel.json'
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/web.yml'
      - 'contracts/**'
      - 'design/**'
      - 'packages/**'
      - 'content/**'
      - 'services/**'
      - 'db/**'
      - 'tsconfig.backend.json'
      - 'vitest.backend.config.ts'
      - 'vitest.web-http.config.ts'
      # Documentation is not an input to application checks. Keep these last.
      - '!**/*.md'
      - '!**/*.mdx'
      - '!apps/web/docs/**'
  push:
    branches: [main]
    paths: *web-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_USE_GROQ: '0'
      TEST_DATABASE_URL: ''
      GROQ_API_KEY: ''
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit and integration tests with local mocks
        if: ${{ !cancelled() }}
        run: npm test
      - name: Build without production configuration
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Build isolated offline learner preview
        if: ${{ !cancelled() }}
        run: npm run build:learner-preview
      - name: Build v2 learner artifact without credentials
        if: ${{ !cancelled() }}
        run: npm run build:learner-product
      - name: Install isolated browser for offline acceptance
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium
      - name: Offline shell cold launch and late sync
        if: ${{ !cancelled() }}
        run: npm run test:offline-shell

name: Web checks

on:
  pull_request:
    paths: ['apps/web/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml', 'contracts/**', 'design/**', 'packages/**', 'content/**', 'services/**', 'db/**', 'tsconfig.backend.json', 'vitest.backend.config.ts', 'vitest.web-http.config.ts']
  push:
    branches: [main]
    paths: ['apps/web/**', 'package.json', 'package-lock.json', '.github/workflows/web.yml', 'contracts/**', 'design/**', 'packages/**', 'content/**', 'services/**', 'db/**', 'tsconfig.backend.json', 'vitest.backend.config.ts', 'vitest.web-http.config.ts']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_USE_GROQ: '0'
      TEST_DATABASE_URL: ''
      GROQ_API_KEY: ''
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit and integration tests with local mocks
        if: ${{ !cancelled() }}
        run: npm test
      - name: Build without production configuration
        if: ${{ !cancelled() }}
        run: npm run build

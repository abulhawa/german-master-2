name: Content enrichment validation
on:
  push:
    branches: ['content/enrichment-workbench']
    paths: ['content/enrichment/**', 'tools/content/enrichment.mjs', 'services/api/scripts/validate-enrichment.ts', '.github/workflows/content-enrichment.yml']
  pull_request:
    paths: ['content/enrichment/**', 'tools/content/enrichment.mjs', 'services/api/scripts/validate-enrichment.ts', '.github/workflows/content-enrichment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node node_modules/tsx/dist/cli.mjs services/api/scripts/validate-enrichment.ts

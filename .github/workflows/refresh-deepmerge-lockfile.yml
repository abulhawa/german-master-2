name: Refresh vendored deepmerge lockfile (temporary)

on:
  push:
    branches: [security/deepmerge-cve-2026-93753]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean install
        run: npm ci --no-audit --no-fund
      - name: Validate patched deepmerge
        run: npm run security:deepmerge
      - name: Check registry vulnerability audit
        run: npm audit --audit-level=low
      - name: Commit regenerated lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'security: lock locally patched deepmerge for Rollup'
            git push origin HEAD:security/deepmerge-cve-2026-93753
          fi

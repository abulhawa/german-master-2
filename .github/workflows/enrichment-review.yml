name: Enrichment review verification
on:
  push:
    branches: ['content/enrichment-review']
    paths: ['content/review/enrichment/**', '.github/workflows/enrichment-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enrichment-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify exact saved review coverage and correction rechecks
        run: python3 content/review/enrichment/validate.py
      - name: Verify strict extension question coverage and pinned source hashes
        run: python3 content/review/enrichment/validate-extension.py
      - name: Validate the unchanged pinned source with the canonical engine
        run: python3 content/review/enrichment/validate-snapshot.py --snapshot 671e9d19f4f5a61d7916ed96b3b41433b768fd39 --dependency-root .
      - name: Validate proposed exercises and rubrics in memory
        run: node node_modules/tsx/dist/cli.mjs content/review/enrichment/validate-overlays.ts
      - name: Validate the complete finished authoring snapshot
        run: python3 content/review/enrichment/validate-snapshot.py --snapshot b7a6507e135895b1ebb671b73538a9a6d3742304 --dependency-root .
      - name: Require generated evidence to match the committed checkpoint
        run: git diff --exit-code -- content/review/enrichment/structural-671e9d19f4f5.json content/review/enrichment/structural-b7a6507e1358.json content/review/enrichment/overlay-validation.json

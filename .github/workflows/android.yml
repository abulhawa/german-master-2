name: Android checks

on:
  pull_request:
    paths: &android-paths
      - 'apps/android/**'
      - '.github/workflows/android.yml'
      - 'contracts/**'
      - 'design/**'
      - 'content/**'
      - 'services/**'
      - 'packages/**'
      - 'db/**'
      # Root npm changes are checked by Web checks and Dependency security audit.
      # Do not rebuild the entire Android app for web-only lockfile updates.
      # Documentation and store artwork are not app or native HTTP test inputs.
      - '!**/*.md'
      - '!**/*.mdx'
      - '!apps/android/docs/**'
      - '!apps/android/play-store-listing/**'
  push:
    branches: [main]
    paths: *android-paths
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 40 || 5 }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check generated foundation contracts and tokens
        working-directory: .
        run: node contracts/scripts/generate.mjs --check && node design/generate.mjs --check
      - name: Install authoritative API dependencies for native HTTP verification
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        run: npm ci
      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          # Trusted manual release run can refresh the Gradle cache.
          cache-read-only: false
      - name: Install imported app SDK requirements
        if: github.event_name == 'workflow_dispatch'
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Fast repository and Android structure checks
        working-directory: .
        run: |
          node tools/generate-native-guest.mjs --check
          test -f apps/android/gradlew
          test -f apps/android/app/build.gradle
          test -f apps/android/gradle/libs.versions.toml
      - name: Android unit tests and debug build (manual release verification)
        if: github.event_name == 'workflow_dispatch'
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --max-workers=4 --build-cache
      # Full release assertions are required before publishing, but are too
      # expensive to repeat on every small PR or push to main.
      # Actions -> Android checks -> Run workflow executes all steps below.
      - name: Verify release rejects missing public v2 configuration
        if: github.event_name == 'workflow_dispatch'
        run: |
          if bash gradlew :app:verifyV2ReleaseConfiguration --no-daemon --max-workers=2 > "$RUNNER_TEMP/release-config-guard.log" 2>&1; then
            echo "ERROR: Android release accepted empty public configuration"
            exit 1
          fi
          grep -q "Complete German Master 2.0 release public configuration required" "$RUNNER_TEMP/release-config-guard.log"
      - name: Reject non-production release host
        if: github.event_name == 'workflow_dispatch'
        env:
          GM_V2_AUTH_PROJECT: sqgjsmiaprsuilcjmaav
          GM_V2_AUTH_PUBLISHABLE_KEY: sb_publishable_ci_synthetic_not_a_credential
          GM_V2_API_ORIGIN: https://untrusted.example
        run: |
          if bash gradlew :app:verifyV2ReleaseConfiguration --no-daemon --max-workers=2 > "$RUNNER_TEMP/release-host-guard.log" 2>&1; then
            echo "ERROR: release accepted a non-production API origin"
            exit 1
          fi
          grep -q "Complete German Master 2.0 release public configuration required" "$RUNNER_TEMP/release-host-guard.log"
      - name: Reject retired production Auth project
        if: github.event_name == 'workflow_dispatch'
        env:
          GM_V2_AUTH_PROJECT: zgmyrpzwgtydwlzponih
          GM_V2_AUTH_PUBLISHABLE_KEY: sb_publishable_ci_synthetic_not_a_credential
          GM_V2_API_ORIGIN: https://germanmaster.qortxai.com
        run: |
          if bash gradlew :app:verifyV2ReleaseConfiguration --no-daemon --max-workers=2 > "$RUNNER_TEMP/retired-project-guard.log" 2>&1; then
            echo "ERROR: release accepted the retired Auth project"
            exit 1
          fi
          grep -q "Complete German Master 2.0 release public configuration required" "$RUNNER_TEMP/retired-project-guard.log"
      - name: Build unsigned production-configured release bundle
        if: github.event_name == 'workflow_dispatch'
        env:
          GM_V2_AUTH_PROJECT: sqgjsmiaprsuilcjmaav
          GM_V2_AUTH_PUBLISHABLE_KEY: sb_publishable_ci_synthetic_not_a_credential
          GM_V2_API_ORIGIN: https://germanmaster.qortxai.com
        run: |
          bash gradlew :app:verifyV2ReleaseConfiguration --no-daemon --max-workers=2
          bash gradlew :app:bundleRelease --dry-run --no-daemon --max-workers=2 > "$RUNNER_TEMP/release-task-graph.log"
          grep -q ':app:verifyV2ReleaseConfiguration SKIPPED' "$RUNNER_TEMP/release-task-graph.log"
          bash gradlew :app:bundleRelease --no-daemon --max-workers=4
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Full native lint and learner-preview build
        if: github.event_name == 'workflow_dispatch'
        run: bash gradlew :app:assembleLearnerPreview :app:lintDebug :app:lintLearnerPreview --no-daemon --continue --max-workers=4 --build-cache
      - name: Report GitHub Actions cache usage (read-only)
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if total=$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq '.active_caches_size_in_bytes' 2>/dev/null) &&
             count=$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq '.active_caches_count' 2>/dev/null); then
            if [[ "$total" =~ ^[0-9]+$ ]] && [[ "$count" =~ ^[0-9]+$ ]]; then
              echo "Repository Actions caches: $count entries, $total bytes total"
              echo "Cache footprint (bytes): $total" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Cache usage API unavailable; no entries were deleted or altered."
          fi

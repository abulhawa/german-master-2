name: Android checks

on:
  pull_request:
    paths: &android-paths
      - 'apps/android/**'
      - '.github/workflows/android.yml'
      - 'contracts/**'
      - 'design/**'
      - 'content/**'
      - 'services/**'
      - 'packages/**'
      - 'db/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      # Documentation and store artwork are not app or native HTTP test inputs.
      - '!**/*.md'
      - '!**/*.mdx'
      - '!apps/android/docs/**'
      - '!apps/android/play-store-listing/**'
  push:
    branches: [main]
    paths: *android-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Check generated foundation contracts and tokens
        working-directory: .
        run: node contracts/scripts/generate.mjs --check && node design/generate.mjs --check
      - name: Install authoritative API dependencies for native HTTP verification
        working-directory: .
        run: npm ci
      - uses: gradle/actions/setup-gradle@v4
      - name: Install imported app SDK requirements
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Verify release rejects missing public v2 configuration
        run: |
          if bash gradlew :app:verifyV2ReleaseConfiguration --no-daemon --max-workers=2 > "$RUNNER_TEMP/release-config-guard.log" 2>&1; then
            echo "ERROR: Android release accepted empty public configuration"
            exit 1
          fi
          grep -q "Complete German Master 2.0 release public configuration required" "$RUNNER_TEMP/release-config-guard.log"
      - name: Verify debug app
        run: bash gradlew testDebugUnitTest assembleDebug assembleLearnerPreview --no-daemon --continue --max-workers=4
      - name: Lint debug app
        if: ${{ !cancelled() }}
        run: bash gradlew lintDebug lintLearnerPreview --no-daemon --max-workers=4

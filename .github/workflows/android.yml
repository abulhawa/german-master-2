name: Android checks

on:
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml', 'contracts/**', 'design/**', 'content/**']
  push:
    branches: [main]
    paths: ['apps/android/**', '.github/workflows/android.yml', 'contracts/**', 'design/**', 'content/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Check generated foundation contracts and tokens
        working-directory: .
        run: node contracts/scripts/generate.mjs --check && node design/generate.mjs --check
      - uses: gradle/actions/setup-gradle@v4
      - name: Install imported app SDK requirements
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Verify debug app
        run: bash gradlew testDebugUnitTest assembleDebug --no-daemon --continue --max-workers=4
      - name: Lint debug app
        if: ${{ !cancelled() }}
        run: bash gradlew lintDebug --no-daemon --max-workers=4

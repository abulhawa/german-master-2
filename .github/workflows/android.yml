name: Android checks

on:
  pull_request:
    paths: ['apps/android/**', '.github/workflows/android.yml', 'contracts/**', 'design/**']
  push:
    branches: [main]
    paths: ['apps/android/**', '.github/workflows/android.yml', 'contracts/**', 'design/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install imported app SDK requirements
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Verify debug app
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --continue --max-workers=4

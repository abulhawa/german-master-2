name: Repository safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: repository-safety-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  history-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download pinned scanner and verify checksum
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          base='https://github.com/gitleaks/gitleaks/releases/download/v8.30.1'
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_linux_x64.tar.gz" --output gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location "$base/gitleaks_8.30.1_checksums.txt" --output checksums.txt
          grep '  gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt > selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
      - name: Scan history with redacted output
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner'

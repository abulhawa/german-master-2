def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

// Android Studio runs Gradle without shell environment variables on many setups.
// These public-only local.properties fallbacks do not read legacy Supabase credentials.
def v2Project = System.getenv("GM_V2_AUTH_PROJECT") ?: localProps.getProperty("gm.v2.auth.project", "")
def v2Key = System.getenv("GM_V2_AUTH_PUBLISHABLE_KEY") ?: localProps.getProperty("gm.v2.auth.publishableKey", "")
def v2Origin = System.getenv("GM_V2_API_ORIGIN") ?: localProps.getProperty("gm.v2.api.origin", "")
def validV2PublicConfig =
    v2Project == "zgmyrpzwgtydwlzponih" &&
    (v2Key ==~ /sb_publishable_[A-Za-z0-9_-]+/) &&
    (v2Origin ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?\/?/)
// Production bundles must never send an Auth bearer token to an arbitrary HTTPS host.
def validV2ReleaseConfig = validV2PublicConfig &&
    v2Origin in ["https://germanmaster.qortxai.com", "https://germanmaster.qortxai.com/"]
if ((v2Project || v2Key || v2Origin) && !validV2PublicConfig) {
    throw new GradleException("Incomplete German Master 2.0 public configuration")
}

android {
    namespace = "com.germanverbmaster.android"
    compileSdk = 37
    ndkVersion = "29.0.14206865"
    // Practice can switch EN/DE independently of the device language, including offline.
    bundle {
        language {
            enableSplit = false
        }
    }

    defaultConfig {
        applicationId = "com.germanverbmaster.android"
        minSdk = 26
        targetSdk = 37
        versionCode = 29
        versionName = "0.2.08"
        // The same v2 client entry point is used in every Android variant.
        buildConfigField("String", "V2_AUTH_PROJECT", groovy.json.JsonOutput.toJson(v2Project))
        buildConfigField("String", "V2_AUTH_PUBLISHABLE_KEY", groovy.json.JsonOutput.toJson(v2Key))
        buildConfigField("String", "V2_API_ORIGIN", groovy.json.JsonOutput.toJson(v2Origin))

        // Preserve legacy field names for imported source compatibility only.
        // Never package the legacy database or Google OAuth configuration in v2.
        buildConfigField("String", "SUPABASE_URL", '""')
        buildConfigField("String", "SUPABASE_ANON_KEY", '""')
        buildConfigField("String", "GOOGLE_WEB_CLIENT_ID", '""')

        ndk {
            debugSymbolLevel = "FULL"
        }
    }

    signingConfigs {
        create("release") {
            def storeFilePath = localProps.getProperty("signing.storeFile")
            storeFile = storeFilePath != null ? file(storeFilePath) : file("placeholder.jks")
            storePassword = localProps.getProperty("signing.storePassword")
            keyAlias = localProps.getProperty("signing.keyAlias")
            keyPassword = localProps.getProperty("signing.keyPassword")
        }
    }

    buildTypes {
        learnerPreview {
            initWith(debug)
            applicationIdSuffix = ".preview"
            versionNameSuffix = "-preview"
            matchingFallbacks = ["debug"]
            // Uses only gm.v2.* public configuration; never reads legacy local.properties credentials.
        }
        release {
            // CI can exercise a minified unsigned AAB without access to owner signing keys.
            // Android Studio's signed-bundle workflow remains owner-managed.
            if (["signing.storeFile", "signing.storePassword", "signing.keyAlias", "signing.keyPassword"]
                    .every { localProps.getProperty(it) }) {
                signingConfig = signingConfigs.getByName("release")
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            ndk {
                debugSymbolLevel = "FULL"
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packaging {
        jniLibs {
            // keepDebugSymbols.add("**/libandroidx.graphics.path.so")
            // keepDebugSymbols.add("**/libdatastore_shared_counter.so")
        }
    }

    lint {
        checkReleaseBuilds = true
        abortOnError = true
    }
}

// The release pre-build always validates its v2 public endpoints.
tasks.register("verifyV2ReleaseConfiguration") {
    group = "verification"
    description = "Require the v2 Auth project, publishable key and canonical production HTTPS API"
    doLast {
        if (!validV2ReleaseConfig) {
            throw new GradleException("Complete German Master 2.0 release public configuration required")
        }
    }
}
tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn(tasks.named("verifyV2ReleaseConfiguration"))
}

